services:
  # MongoDB service
  mongodb:
    image: mongo:7.0
    container_name: crawler-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-crawler_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - crawler-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Crawler application service
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB connection - connect to containerized MongoDB
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DATABASE:-crawler_db}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-crawler_db}
      
      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONFIG_PATH: ${CONFIG_PATH:-/app/config/defaults.json}
      API_PORT: ${API_PORT:-8000}
      API_HOST: ${API_HOST:-0.0.0.0}
      
      # Crawler settings
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-30}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-5}
      
      # Browser settings
      HEADLESS: ${HEADLESS:-true}
      BROWSER_TYPE: ${BROWSER_TYPE:-chromium}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - crawler-network
    entrypoint: ["python", "main.py"]

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  crawler-network:
    driver: bridge

